name: "Feature request"
description: "Propose a user-facing improvement"
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials and private source before posting. Security vulnerabilities belong in [private reporting](https://github.com/wavefnd/Vex/security/advisories/new), not this public form.
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Describe the use case and current limitation."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior"
      description: "Examples of commands or manifests are helpful."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives and compatibility"
      description: "Optional alternatives, affected platforms or existing workflows."
    validations:
      required: false
