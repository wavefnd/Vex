name: Dependency audit
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Audit exact locked dependencies
        run: python tools/dependency_audit.py
  parser-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install supported toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Mutate all structured input boundaries
        shell: bash
        run: cargo run --locked --example parser_fuzz -- "$GITHUB_RUN_ID" 100000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: minimized-parser-failures
          path: target/parser-fuzz-crash
          if-no-files-found: ignore
