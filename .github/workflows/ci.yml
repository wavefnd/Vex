name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality / Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python tools/repository_checks.py
      - run: python tools/check_links.py --external
      - run: python tools/dependency_audit.py
      - run: cargo run --locked --example parser_fuzz -- 20261005 2000
      - run: cargo fmt --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
  platform:
    name: Platform / ${{ matrix.id }}
    timeout-minutes: 180
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executor: native
            extension: tar.gz
          - id: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executor: native
            extension: tar.gz
          - id: linux-riscv64
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            executor: qemu
            extension: tar.gz
            image: debian@sha256:e3b4cb1b0056896c4b43e17472b906b10007ab94bc533d37a47e9a5795eebbc0
            oci_platform: linux/riscv64
          - id: linux-loongarch64
            os: ubuntu-24.04
            target: loongarch64-unknown-linux-gnu
            executor: qemu
            extension: tar.gz
            image: ghcr.io/loong64/debian@sha256:f58d4dbdfc29497e5228fd5f418319d76842f257940c746d948dfe67b4e16ba9
            oci_platform: linux/loong64
          - id: macos-amd64
            os: macos-15-intel
            target: x86_64-apple-darwin
            executor: native
            extension: tar.gz
          - id: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            executor: native
            extension: tar.gz
          - id: windows-amd64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            executor: native
            extension: zip
          - id: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            executor: native
            extension: zip
          - id: freebsd-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-freebsd
            executor: vm
            extension: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        if: matrix.executor == 'native'
        run: |
          rustup set default-host ${{ matrix.target }}
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.executor == 'native'
        with:
          python-version: '3.11'
      - name: Complete native acceptance
        if: matrix.executor == 'native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_platform.py ${{ matrix.id }}
      - name: Register target execution
        if: matrix.executor == 'qemu'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: tonistiigi/binfmt@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
          platforms: riscv64,loong64
      - name: Complete emulated acceptance
        if: matrix.executor == 'qemu'
        shell: bash
        run: |
          docker run --rm --platform '${{ matrix.oci_platform }}' \
            -v "$PWD:/work" -w /work '${{ matrix.image }}' \
            sh tools/ci_guest.sh '${{ matrix.id }}'
      - name: Complete FreeBSD acceptance
        if: matrix.executor == 'vm'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.4'
          arch: x86_64
          usesh: true
          mem: 6144
          copyback: true
          run: sh tools/ci_guest.sh freebsd-amd64
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-${{ matrix.id }}
          path: dist/acceptance-*.json
          if-no-files-found: error
