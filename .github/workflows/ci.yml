name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality / Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  release-tooling:
    name: Package / Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
          rustup default stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release binary
        run: python x.py build x86_64-unknown-linux-gnu

      - name: Package and smoke test release binary
        run: python x.py package x86_64-unknown-linux-gnu

      - name: Verify release checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS

  test:
    name: Test / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-2025
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release tooling
        run: python -m unittest discover -s tests/xpy -v

      - name: Run unit and integration tests
        if: runner.os != 'Windows'
        run: cargo test --locked

      - name: Run unit tests
        if: runner.os == 'Windows'
        run: cargo test --locked --bin vex

      - name: Build
        run: cargo build --locked

  macos-arm64:
    name: Build / macOS arm64
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - name: Cross-build
        run: cargo build --locked --target aarch64-apple-darwin

  linux-riscv64:
    name: Build / Linux riscv64
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RISC-V system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-linux-gnu qemu-user

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target riscv64gc-unknown-linux-gnu
          rustup default stable

      - name: Cross-build
        run: cargo build --locked --target riscv64gc-unknown-linux-gnu

      - name: Run RISC-V smoke test with QEMU
        run: qemu-riscv64 -L /usr/riscv64-linux-gnu target/riscv64gc-unknown-linux-gnu/debug/vex --version
