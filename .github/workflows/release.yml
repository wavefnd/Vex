name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Cargo version without the v prefix (for example: 0.0.1)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: manual-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify authoritative release source
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "wavefnd/Vex" ]]; then
            echo "error: official releases must run in wavefnd/Vex, not $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "error: official releases must be dispatched from master, not $GITHUB_REF" >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          git fetch --force --tags origin
          remote_master="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ -z "$remote_master" || "$commit" != "$remote_master" ]]; then
            echo "error: release commit $commit is not current wavefnd/Vex:master ($remote_master)" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          cargo_version="$(python x.py --version | awk '{print $2}')"
          if [[ "$cargo_version" != "$RELEASE_VERSION" ]]; then
            echo "error: Cargo.toml version is $cargo_version, input is $RELEASE_VERSION" >&2
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "error: tag already exists in wavefnd/Vex: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Run release validation
        run: python x.py check

  build:
    name: Package / ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - name: Linux RISC-V
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Install RISC-V system tools
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-linux-gnu qemu-user

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build release binary
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && 'riscv64-linux-gnu-gcc' || '' }}
        run: python x.py build ${{ matrix.target }}

      - name: Package and smoke test release binary
        run: python x.py package ${{ matrix.target }}

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/vex-*-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create GitHub release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete archive set and write checksums
        shell: bash
        run: |
          set -euo pipefail

          python x.py checksum \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            riscv64gc-unknown-linux-gnu
          cd dist
          sha256sum --check SHA256SUMS

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release create "$RELEASE_TAG"
            dist/vex-*.tar.gz
            dist/vex-*.zip
            dist/SHA256SUMS
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_COMMIT"
            --title "Vex $RELEASE_TAG"
            --generate-notes
          )

          if [[ "${{ inputs.draft }}" == "true" ]]; then
            args+=(--draft)
          fi

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
