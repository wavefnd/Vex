name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify authoritative release source
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "wavefnd/Vex" ]]; then
            echo "error: official releases must run in wavefnd/Vex, not $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "error: official releases must be dispatched from master, not $GITHUB_REF" >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          git fetch --force --tags origin
          remote_master="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ -z "$remote_master" || "$commit" != "$remote_master" ]]; then
            echo "error: release commit $commit is not current wavefnd/Vex:master ($remote_master)" >&2
            exit 1
          fi

          version="$(python x.py --version | awk '{print $2}')"
          tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_type="$(git cat-file -t "refs/tags/$tag")"
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_type" != "tag" || "$tag_commit" != "$commit" ]]; then
              echo "error: existing $tag is not an annotated tag for release commit $commit" >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Run release validation
        run: python x.py check

  build:
    name: Package / ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - name: Linux RISC-V
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Install RISC-V system tools
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-riscv64-linux-gnu qemu-user

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build release binary
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'riscv64gc-unknown-linux-gnu' && 'riscv64-linux-gnu-gcc' || '' }}
        run: python x.py build ${{ matrix.target }}

      - name: Package and smoke test release binary
        run: python x.py package ${{ matrix.target }}

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/vex-*-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Tag, attest, and create draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete archive set and write checksums
        shell: bash
        run: |
          python x.py checksum \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            riscv64gc-unknown-linux-gnu
          cd dist
          sha256sum --check SHA256SUMS

      - name: Create authoritative annotated release tag
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_type" != "tag" || "$tag_commit" != "$RELEASE_COMMIT" ]]; then
              echo "error: existing $RELEASE_TAG is not an annotated tag for $RELEASE_COMMIT" >&2
              exit 1
            fi
            echo "Reusing existing authoritative tag $RELEASE_TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Vex $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          python x.py verify-release

      - name: Generate build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/vex-*.tar.gz
            dist/vex-*.zip
            dist/SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "error: release $RELEASE_TAG is already published" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              --clobber \
              dist/vex-*.tar.gz \
              dist/vex-*.zip \
              dist/SHA256SUMS
            gh release edit "$RELEASE_TAG" \
              --draft \
              --notes-file RELEASE_NOTES.md \
              --title "Vex $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --notes-file RELEASE_NOTES.md \
              --title "Vex $RELEASE_TAG" \
              dist/vex-*.tar.gz \
              dist/vex-*.zip \
              dist/SHA256SUMS
          fi
