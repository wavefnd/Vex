name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Cargo version without the v prefix (for example: 0.0.1)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verify authoritative release source
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "wavefnd/Vex" ]]; then
            echo "error: official releases must run in wavefnd/Vex, not $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "error: official releases must be dispatched from master, not $GITHUB_REF" >&2
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          git fetch --force --tags origin
          remote_master="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ -z "$remote_master" || "$commit" != "$remote_master" ]]; then
            echo "error: release commit $commit is not current wavefnd/Vex:master ($remote_master)" >&2
            exit 1
          fi

          python tools/release_version.py "$RELEASE_VERSION"

          cargo_version="$(python x.py --version | awk '{print $2}')"
          if [[ "$cargo_version" != "$RELEASE_VERSION" ]]; then
            echo "error: Cargo.toml version is $cargo_version, input is $RELEASE_VERSION" >&2
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "error: tag already exists in wavefnd/Vex: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Audit locked release dependencies
        run: python tools/dependency_audit.py

      - name: Run release validation
        run: python x.py check

  build:
    name: Package / ${{ matrix.id }}
    needs: validate
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executor: native
            extension: tar.gz
          - id: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executor: native
            extension: tar.gz
          - id: linux-riscv64
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            executor: qemu
            extension: tar.gz
            image: debian@sha256:e3b4cb1b0056896c4b43e17472b906b10007ab94bc533d37a47e9a5795eebbc0
            oci_platform: linux/riscv64
          - id: linux-loongarch64
            os: ubuntu-24.04
            target: loongarch64-unknown-linux-gnu
            executor: qemu
            extension: tar.gz
            image: ghcr.io/loong64/debian@sha256:f58d4dbdfc29497e5228fd5f418319d76842f257940c746d948dfe67b4e16ba9
            oci_platform: linux/loong64
          - id: macos-amd64
            os: macos-15-intel
            target: x86_64-apple-darwin
            executor: native
            extension: tar.gz
          - id: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            executor: native
            extension: tar.gz
          - id: windows-amd64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            executor: native
            extension: zip
          - id: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            executor: native
            extension: zip
          - id: freebsd-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-freebsd
            executor: vm
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Install Rust toolchain
        if: matrix.executor == 'native'
        run: |
          rustup set default-host ${{ matrix.target }}
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.executor == 'native'
        with:
          python-version: '3.11'
      - name: Complete native acceptance
        if: matrix.executor == 'native'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci_platform.py ${{ matrix.id }}
      - name: Register target execution
        if: matrix.executor == 'qemu'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: tonistiigi/binfmt@sha256:465d3fdd28d0f2b871ba4b4ec98bd183292e96167f00d9fd40bd249f8632d705
          platforms: riscv64,loong64
      - name: Complete emulated acceptance
        if: matrix.executor == 'qemu'
        shell: bash
        run: |
          docker run --rm --platform '${{ matrix.oci_platform }}' \
            -v "$PWD:/work" -w /work '${{ matrix.image }}' \
            sh tools/ci_guest.sh '${{ matrix.id }}'
      - name: Complete FreeBSD acceptance
        if: matrix.executor == 'vm'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.4'
          arch: x86_64
          usesh: true
          mem: 6144
          copyback: true
          run: sh tools/ci_guest.sh freebsd-amd64
      - name: Attest release archive and acceptance evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/vex-*-${{ matrix.target }}.${{ matrix.extension }}
            dist/acceptance-${{ matrix.id }}.json
          create-storage-record: false
      - name: Upload release archive and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/vex-*-${{ matrix.target }}.${{ matrix.extension }}
            dist/acceptance-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create GitHub release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete archive set and write checksums
        shell: bash
        run: |
          set -euo pipefail

          python x.py checksum \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            riscv64gc-unknown-linux-gnu \
            loongarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            x86_64-unknown-freebsd
          cd dist
          sha256sum --check SHA256SUMS

      - name: Require all platform acceptance reports
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python tools/repository_checks.py --acceptance dist --commit "$RELEASE_COMMIT"

      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
          create-storage-record: false

      - name: Verify archive provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/vex-*.tar.gz dist/vex-*.zip dist/SHA256SUMS dist/acceptance-*.json; do
            gh attestation verify "$archive" --repo wavefnd/Vex \
              --signer-workflow wavefnd/Vex/.github/workflows/release.yml \
              --source-ref refs/heads/master --source-digest "$RELEASE_COMMIT" \
              --signer-digest "$RELEASE_COMMIT" --deny-self-hosted-runners
          done

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release create "$RELEASE_TAG"
            dist/vex-*.tar.gz
            dist/vex-*.zip
            dist/SHA256SUMS
            dist/acceptance-*.json
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_COMMIT"
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [[ "${{ inputs.draft }}" == "true" ]]; then
            args+=(--draft)
          fi

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          python tools/release_gate.py --commit "$RELEASE_COMMIT"
          gh "${args[@]}"
